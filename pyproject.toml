[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-adc-proxy"
version = "1.0.0"
description = "Streaming OpenAI-compatible reverse proxy for Vertex AI using ADC"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "google-auth>=2.35,<3",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gui = [
  "PyQt6>=6.6,<7",
  "pyinstaller>=6.3,<7",
  "pillow>=10.0.0"
]

[tool.setuptools.packages.find]
include = ["vertex_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
